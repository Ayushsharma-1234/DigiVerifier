    port: 587
    username: ${MAIL_USERNAME:test@gmail.com}
    password: ${MAIL_PASSWORD:testpass}
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET:etulasetu-secret-key-2026-legal-metrology-sih-very-long-secret}
  expiration: 86400000
app:
  base-url: http://localhost:3000
  cors:
    allowed-origins: http://localhost:3000
