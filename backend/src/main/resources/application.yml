spring:
  application:
    name: etulasetu
  datasource:
    url: jdbc:postgresql://localhost:5432/etulasetu
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
